name: Deploy Firstday Demo
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: firstday-demo-deployment
  cancel-in-progress: false
env:
  EAI_TENANT_ID: ${{ vars.EAI_TENANT_ID }}
  EAI_WORKFLOW_ID: ${{ vars.EAI_WORKFLOW_ID }}
  BASE_URL_PUBLIC_API: ${{ vars.BASE_URL_PUBLIC_API }}
  ROUTING_BOOTSTRAP_PUBLIC_API_URL: ${{ vars.ROUTING_BOOTSTRAP_PUBLIC_API_URL }}
  ENTRA_TENANT_NAME: ${{ vars.ENTRA_TENANT_NAME }}
  ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
  ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
  ENTRA_SCOPES: ${{ vars.ENTRA_SCOPES }}
  ONBOARDING_DOCUMENT_WORKFLOW_KEY: ${{ vars.ONBOARDING_DOCUMENT_WORKFLOW_KEY }}
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
      EAI_READINESS_PROBE_TOKEN: ${{ secrets.EAI_READINESS_PROBE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/demo-deployment.mjs check
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      - run: npm ci --ignore-scripts
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npm run test:unit:ci && npm run typecheck
        env:
          EAI_TENANT_ID: ''
      - run: npm run build
        env:
          CYPRESS_INSTALL_BINARY: '0'
          NEXT_PUBLIC_EAI_TENANT_ID: ${{ vars.EAI_TENANT_ID }}
          NEXT_PUBLIC_APP_NAME: firstday
          APP_BASE_PATH: ''
          NEXT_PUBLIC_APP_BASE_PATH: ''
      - run: node --test tests/demo-deployment.test.mjs
  deploy:
    needs: validate
    uses: EAI-verticals/demo-infra/.github/workflows/deploy-container-app.yml@e5f81d20498619fb60dc68530501e1771c43a3db
    with:
      app-name: firstday
      environment: dev
      config-path: ./config/container-app.yaml
      build-args: |
        NEXT_PUBLIC_EAI_TENANT_ID=${{ vars.EAI_TENANT_ID }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  configure-and-verify:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
      EAI_READINESS_PROBE_TOKEN: ${{ secrets.EAI_READINESS_PROBE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: node scripts/demo-deployment.mjs configure
